name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config qmake6 qt6-base-dev libgl1-mesa-dev \
            portaudio19-dev libasound2-dev libsndfile1-dev libsamplerate0-dev \
            librubberband-dev libmp3lame-dev libfftw3-dev libx11-dev libjack-jackd2-dev liblilv-dev lv2-dev libssl-dev python3

      - name: Build
        run: |
          qmake6 Vybrant.pro
          make -j"$(nproc)"

      - name: Self test
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_CONFIG_HOME: ${{ runner.temp }}/cfg
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: ./bin/vybrant --selftest

      - name: UI test (control socket)
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: python3 tests/ui_test.py ./bin/vybrant

      - name: CLAP ABI check (skips without the official headers)
        run: python3 tests/clap_abi_check.py

      - name: Sync test (JACK transport, MIDI clock in; skips what the runner lacks)
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: python3 tests/sync_test.py ./bin/vybrant

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true   # current packages: installing onto the image's older base is a partial upgrade
          install: >-
            zip mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-portaudio mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-libsamplerate mingw-w64-ucrt-x86_64-rubberband mingw-w64-ucrt-x86_64-lame
            mingw-w64-ucrt-x86_64-fftw mingw-w64-ucrt-x86_64-openssl mingw-w64-ucrt-x86_64-gdb

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Self test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: 1   # a GUI app's Qt messages go to the debugger otherwise
        run: ./build/Vybrant.exe --selftest

      - name: Self test backtrace (after a crash)
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: 1
        run: gdb -q -batch -ex run -ex bt --args ./build/Vybrant.exe --selftest

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: License server (build + signing test)
        run: cd server && npm ci && npm test
      - name: Website (typecheck + build)
        run: cd web && npm ci && npm run build

  format-check:
    # Pinned to the clang-format the code is formatted with: versions differ in their output
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pip install clang-format==23.1.3
      - name: Check formatting
        run: git ls-files 'src/*.cpp' 'src/*.h' | xargs clang-format --dry-run --Werror
