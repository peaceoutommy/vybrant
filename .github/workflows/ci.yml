name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config qmake6 qt6-base-dev libgl1-mesa-dev \
            portaudio19-dev libasound2-dev libsndfile1-dev libsamplerate0-dev \
            librubberband-dev libmp3lame-dev libfftw3-dev libx11-dev libjack-jackd2-dev liblilv-dev lv2-dev libssl-dev python3

      - name: Build
        run: |
          qmake6 Tactum.pro
          make -j"$(nproc)"

      - name: Self test
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_CONFIG_HOME: ${{ runner.temp }}/cfg
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: ./bin/tactum --selftest

      - name: UI test (control socket)
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: python3 tests/ui_test.py ./bin/tactum

      - name: CLAP ABI check (skips without the official headers)
        run: python3 tests/clap_abi_check.py

      - name: Sync test (JACK transport, MIDI clock in; skips what the runner lacks)
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: python3 tests/sync_test.py ./bin/tactum

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: License server (build + signing test)
        run: cd server && npm ci && npm test
      - name: Website (typecheck + build)
        run: cd web && npm ci && npm run build

  format-check:
    # Advisory: clang-format output differs slightly between versions, so a mismatch here doesn't fail the build
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format
      - name: Check formatting
        run: git ls-files 'src/*.cpp' 'src/*.h' | xargs clang-format --dry-run --Werror
