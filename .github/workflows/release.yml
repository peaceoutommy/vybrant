name: Release

# A tag like v0.1.0 builds an AppImage and a portable Windows zip and publishes them as a GitHub release. "Run workflow" on
# the Actions tab builds both without releasing them (they're attached to the run as artifacts).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config qmake6 qt6-base-dev libgl1-mesa-dev \
            portaudio19-dev libasound2-dev libsndfile1-dev libsamplerate0-dev \
            librubberband-dev libmp3lame-dev libfftw3-dev libx11-dev libjack-jackd2-dev liblilv-dev lv2-dev libssl-dev file

      - name: Build
        run: |
          qmake6 Vybrant.pro
          make -j"$(nproc)"

      - name: Self test
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_CONFIG_HOME: ${{ runner.temp }}/cfg
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: ./bin/vybrant --selftest

      - name: Package AppImage
        env:
          QMAKE: qmake6
          APPIMAGE_EXTRACT_AND_RUN: 1   # the runner has no FUSE
          LINUXDEPLOY_OUTPUT_VERSION: ${{ github.ref_name }}
        run: |
          for tool in linuxdeploy linuxdeploy-plugin-qt; do
            curl -fsSLO "https://github.com/linuxdeploy/$tool/releases/download/continuous/$tool-x86_64.AppImage"
          done
          chmod +x linuxdeploy*.AppImage
          PATH="$PWD:$PATH" ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable bin/vybrant \
            --desktop-file resources/vybrant.desktop \
            --icon-file resources/vybrant.png \
            --plugin qt --output appimage
          ls -l *.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: Vybrant-*.AppImage

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            zip mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-portaudio mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-libsamplerate mingw-w64-ucrt-x86_64-rubberband mingw-w64-ucrt-x86_64-lame
            mingw-w64-ucrt-x86_64-fftw mingw-w64-ucrt-x86_64-openssl mingw-w64-ucrt-x86_64-gdb

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Self test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: 1   # a GUI app's Qt messages go to the debugger otherwise
        run: ./build/Vybrant.exe --selftest

      - name: Self test backtrace (after a crash)
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: 1
        run: gdb -q -batch -ex run -ex bt --args ./build/Vybrant.exe --selftest

      - name: Package portable zip
        run: |
          dir="Vybrant-${{ github.ref_name }}-windows-x64"
          packaging/windows-dist.sh build/Vybrant.exe "$MINGW_PREFIX" "$dir"
          zip -qr "$dir.zip" "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Vybrant-*-windows-x64.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [appimage, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Vybrant-* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
